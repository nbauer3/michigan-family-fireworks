# netlify.toml — Netlify deployment config for Michigan Family Fireworks
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "dist"          # Vite outputs to ./dist by default
  functions = "netlify/functions"  # Netlify Functions directory

[build.environment]
  NODE_VERSION = "20"        # pin a Node LTS for reproducible builds

# Function build configuration for local dev
[functions]
  # Use esbuild to transpile TypeScript functions
  node_bundler = "esbuild"

# SPA fallback: serve index.html for any unknown route so client-side
# deep links (e.g. /#contact) resolve instead of 404-ing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Sensible security headers for a static marketing site.
# Single header set works for both dev and production.
# Uses 'unsafe-inline' for scripts/styles (needed for Vite HMR in dev,
# and Tailwind/Google Fonts inline styles in production).
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent framing (clickjacking protection)
    X-Frame-Options = "SAMEORIGIN"
    # Prevent MIME-sniffing
    X-Content-Type-Options = "nosniff"
    # Limit referrer information on cross-origin requests
    Referrer-Policy = "strict-origin-when-cross-origin"
    # HSTS: enforce HTTPS for 1 year, include subdomains, allow preload
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Permissions Policy: restrict powerful browser features for a static marketing site
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()"
    # CSP: allows necessary resources for both dev and prod
    # script-src: 'unsafe-inline' needed for Vite HMR (dev) + React scripts
    # style-src: 'unsafe-inline' needed for Tailwind/Google Fonts
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.netlify.app; media-src 'self'; frame-src 'none'; base-uri 'self'; form-action 'self'"
